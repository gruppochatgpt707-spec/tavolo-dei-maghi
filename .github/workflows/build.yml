name: Sito e app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Sito
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Libreria di collegamento inclusa nel gioco
        run: |
          mkdir -p /tmp/peer && cd /tmp/peer && npm init -y >/dev/null && npm install peerjs@1.5.5 --no-audit --no-fund
          mkdir -p "$GITHUB_WORKSPACE/web/vendor" && cp node_modules/peerjs/dist/peerjs.min.js "$GITHUB_WORKSPACE/web/vendor/"
      - name: Elenco dei file per il gioco senza rete
        run: python3 tools/build.py
      - uses: actions/upload-artifact@v4
        with: { name: web, path: web }
      - uses: actions/upload-pages-artifact@v3
        with: { path: web }

  pages:
    name: Pubblica il sito
    needs: web
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  android:
    name: App Android
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: web, path: web-built }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Strumenti Android
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null
      - name: Progetto Capacitor
        working-directory: native/android
        run: |
          npm install --no-audit --no-fund
          rm -rf www && cp -r ../../web-built www
          npx cap add android
          pip install --quiet pillow
          VERSION_CODE=${{ github.run_number }} VERSION_NAME=1.0.${{ github.run_number }} python3 patch.py . ../icon-1024.png
          npx cap sync android
      - name: Chiave di firma
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "KEYSTORE_PASSWORD=$KS_PASS" >> $GITHUB_ENV; echo "KEY_PASSWORD=$KS_PASS" >> $GITHUB_ENV; echo "KEY_ALIAS=$KS_ALIAS" >> $GITHUB_ENV
          else
            echo "::warning::Manca la chiave di firma nei segreti: uso una chiave temporanea, l'APK si installa ma non va bene per il Play Store."
            keytool -genkeypair -keystore "$RUNNER_TEMP/upload.jks" -storepass temporanea -keypass temporanea -alias tavolo -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Tavolo dei Maghi"
            echo "KEYSTORE_PASSWORD=temporanea" >> $GITHUB_ENV; echo "KEY_PASSWORD=temporanea" >> $GITHUB_ENV; echo "KEY_ALIAS=tavolo" >> $GITHUB_ENV
          fi
          echo "KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> $GITHUB_ENV
      - name: Compila APK e pacchetto Play Store
        working-directory: native/android/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease bundleRelease
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/out/TavoloDeiMaghi-Android.apk"
          cp app/build/outputs/bundle/release/app-release.aab "$GITHUB_WORKSPACE/out/TavoloDeiMaghi-PlayStore.aab"
      - uses: actions/upload-artifact@v4
        with: { name: android, path: out }

  desktop:
    name: App per ${{ matrix.label }}
    needs: web
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: Mac
            flag: --mac
          - os: windows-latest
            label: Windows
            flag: --win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: web, path: native/desktop/web }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Compila
        working-directory: native/desktop
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          mkdir -p build && cp ../icon-1024.png build/icon.png
          npm install --no-audit --no-fund
          npx electron-builder ${{ matrix.flag }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.label }}
          path: |
            native/desktop/dist/*.dmg
            native/desktop/dist/*.exe

  release:
    name: Pagina di download
    needs: [android, desktop]
    if: always() && (needs.android.result == 'success' || needs.desktop.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: files, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Tavolo dei Maghi 1.0.${{ github.run_number }}
          make_latest: true
          body: |
            Scarica l'app per il tuo dispositivo:
            - **Android**: TavoloDeiMaghi-Android.apk (installazione diretta)
            - **Mac**: TavoloDeiMaghi-mac.dmg
            - **Windows**: TavoloDeiMaghi-Windows-Setup.exe
            Il file .aab serve solo per caricare l'app sul Play Store.
            Si gioca anche dal browser: https://gruppochatgpt707-spec.github.io/tavolo-dei-maghi/
          files: |
            files/*.apk
            files/*.aab
            files/*.dmg
            files/*.exe
