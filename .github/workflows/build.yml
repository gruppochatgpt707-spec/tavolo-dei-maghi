name: Sito e app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Sito
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Libreria di collegamento inclusa nel gioco
        run: |
          mkdir -p /tmp/peer && cd /tmp/peer && npm init -y >/dev/null && npm install peerjs@1.5.5 --no-audit --no-fund
          mkdir -p "$GITHUB_WORKSPACE/web/vendor" && cp node_modules/peerjs/dist/peerjs.min.js "$GITHUB_WORKSPACE/web/vendor/"
      - name: Elenco dei file per il gioco senza rete
        run: python3 tools/build.py
      - uses: actions/upload-artifact@v4
        with: { name: web, path: web }
      - uses: actions/upload-pages-artifact@v3
        with: { path: web }

  pages:
    name: Pubblica il sito
    needs: web
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  android:
    name: App Android
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: web, path: web-built }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Strumenti Android
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null
      - name: Progetto Capacitor
        working-directory: native/android
        run: |
          npm install --no-audit --no-fund
          rm -rf www && cp -r ../../web-built www
          npx cap add android
          pip install --quiet pillow
          VERSION_CODE=${{ github.run_number }} VERSION_NAME=1.0.${{ github.run_number }} python3 patch.py . ../icon-1024.png
          npx cap sync android
      - name: Chiave di firma
        env:
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
        run: |
          if [ -n "$KEY_PASS" ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in native/android/upload.jks.enc -out "$RUNNER_TEMP/upload.jks" -pass env:KEY_PASS
            echo "KEYSTORE_PASSWORD=$KEY_PASS" >> $GITHUB_ENV; echo "KEY_PASSWORD=$KEY_PASS" >> $GITHUB_ENV
            echo "REAL_KEY=1" >> $GITHUB_ENV
          else
            echo "::warning::Manca il segreto ANDROID_KEY_PASS: uso una chiave temporanea. L'APK si installa, ma il pacchetto per il Play Store non viene creato."
            keytool -genkeypair -keystore "$RUNNER_TEMP/upload.jks" -storepass temporanea -keypass temporanea -alias tavolo -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Tavolo dei Maghi"
            echo "KEYSTORE_PASSWORD=temporanea" >> $GITHUB_ENV; echo "KEY_PASSWORD=temporanea" >> $GITHUB_ENV
          fi
          echo "KEY_ALIAS=tavolo" >> $GITHUB_ENV
          echo "KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> $GITHUB_ENV
      - name: Compila APK e pacchetto Play Store
        working-directory: native/android/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease bundleRelease
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/out/TavoloDeiMaghi-Android.apk"
          if [ "$REAL_KEY" = "1" ]; then cp app/build/outputs/bundle/release/app-release.aab "$GITHUB_WORKSPACE/out/TavoloDeiMaghi-PlayStore.aab"; fi
      - uses: actions/upload-artifact@v4
        with: { name: android, path: out }

  windows:
    name: App per Windows
    needs: web
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: web, path: native/desktop/web }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Compila
        working-directory: native/desktop
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          mkdir -p build && cp ../icon-1024.png build/icon.png
          npm install --no-audit --no-fund
          npx electron-builder --win --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-Windows
          path: native/desktop/dist/*.exe

  mac:
    name: App per Mac
    needs: web
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: web, path: native/desktop/web }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Compila
        working-directory: native/desktop
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          mkdir -p build && cp ../icon-1024.png build/icon.png
          npm install --no-audit --no-fund
          npx electron-builder --mac --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-Mac
          path: native/desktop/dist/*.dmg

  release:
    name: Pagina di download
    needs: [android, windows]
    if: always() && (needs.android.result == 'success' || needs.windows.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: files, merge-multiple: true, pattern: '{android,desktop-Windows}' }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Tavolo dei Maghi 1.0.${{ github.run_number }}
          make_latest: true
          body: |
            Scarica l'app per il tuo dispositivo:
            - **Android**: TavoloDeiMaghi-Android.apk (installazione diretta)
            - **Mac**: TavoloDeiMaghi-mac.dmg
            - **Windows**: TavoloDeiMaghi-Windows-Setup.exe
            Il file .aab serve solo per caricare l'app sul Play Store.
            L'app per Mac compare qui qualche minuto dopo le altre.
            Si gioca anche dal browser: https://gruppochatgpt707-spec.github.io/tavolo-dei-maghi/
          files: |
            files/*.apk
            files/*.aab
            files/*.exe

  release-mac:
    name: Aggiunge l'app per Mac
    needs: [mac, release]
    if: always() && needs.mac.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { name: desktop-Mac, path: files }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          files: files/*.dmg
